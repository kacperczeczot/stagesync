[package]
name = "stagesync-desktop"
version = "5.4.12"
description = "StageSync thin desktop shell (ADR 0010)"
authors = ["StageSync"]
edition = "2021"
rust-version = "1.77"
# Required once [[bin]] stagesync-setup exists — `tauri dev` / `cargo run` need a default.
default-run = "stagesync-desktop"

[lib]
name = "stagesync_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stagesync-desktop"
path = "src/main.rs"

[[bin]]
name = "stagesync-setup"
path = "src/bin/stagesync-setup.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
open = "5"
flume = "0.12"
mdns-sd = "0.21"
url = "2"
arboard = "3"
# Setup bootstrapper (immediate splash + silent NSIS)
wry = "0.56"
tao = "0.36"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
